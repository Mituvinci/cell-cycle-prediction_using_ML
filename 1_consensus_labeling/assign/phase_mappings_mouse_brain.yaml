# Manual Phase Assignment for Mouse Brain 10k Dataset
# Based on heatmap color similarity analysis
# Date: 2025-11-30

mouse_brain:
  _description: "Manual phase assignment for mouse brain 10k cells dataset based on heatmap analysis"
  reference_tool: seurat

  # ccAFv2 mappings
  # (G1 + M/Early G1 + Unknown + qG0) → G1
  # (Late G1 + S + S/G2) → S
  # (G2M) → G2M
  ccafv2:
    _heatmap: heatmap_seurat_vs_ccafv2_mouse_brain.png
    M/Early G1: G1
    Unknown: G1
    qG0: G1
    Late G1: S
    S/G2: S
    _note: "G1, S, G2M already standard (no mapping needed)"

  # Tricycle mappings
  # (M.G1 + NA) → G1
  # (G1.S + S) → S
  # (G2 + G2M) → G2M
  tricycle:
    _heatmap: heatmap_seurat_vs_tricycle_mouse_brain.png
    M.G1: G1
    NA: G1
    G1.S: S
    G2: G2M
    _note: "S and G2M already standard (no mapping needed)"

  # Note: Revelio not applicable for mouse (human-only tool)
