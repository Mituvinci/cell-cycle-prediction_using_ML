# Phase Mapping Configuration for Buettner mESC - Revelio
# ========================================================
#
# This file defines how Revelio sub-phases are mapped to 3 main phases (G1, S, G2M)
# for the Buettner mESC dataset.
#
# Mappings were determined by:
# 1. Creating contingency table comparing Revelio predictions vs GroundTruth
# 2. Calculating observed/expected ratios
# 3. Generating heatmap with color gradients
# 4. Manually inspecting heatmap colors to determine phase similarities
#
# Revelio predicts 5 phases: G1.S, G2, G2.M, M.G1, S
# Ground truth has 3 phases: G1, S, G2M

dataset: "buettner_mESC"
tool: "revelio"

# Phase mappings based on heatmap analysis (2025-12-16)
mappings:
  revelio:
    G1.S: "G1"      # G1/S transition maps to G1 (based on heatmap)
    G2: "G2M"       # G2 phase maps to G2M
    G2.M: "G2M"     # G2/M transition maps to G2M
    M.G1: "S"       # M/G1 transition maps to S (based on heatmap)
    S: "S"          # S phase remains S

# Rationale (from heatmap inspection):
# - G1.S → G1: Strong alignment with G1 groundtruth phase
# - G2 → G2M: High observed/expected ratio with G2M groundtruth
# - G2.M → G2M: High observed/expected ratio with G2M groundtruth
# - M.G1 → S: Strong alignment with S groundtruth phase
# - S → S: Direct match with S groundtruth phase
